llm:
  provider: velona
  base_url: ${VELONA_BASE_URL}
  api_key: ${VELONA_API_KEY}
  model: ${VELONA_MODEL}
  temperature: 0
  # function_calling | json_mode | json_schema  (switch if Velona's model rejects one)
  structured_output_method: function_calling

mcp:
  oauth_redirect_port: 3030
  token_dir: .tokens
  servers:
    zepto:
      url: https://mcp.zepto.co.in/mcp
      enabled: true
    swiggy_food:
      url: https://mcp.swiggy.com/food
      enabled: true
    zomato:
      url: https://mcp-server.zomato.com/mcp
      enabled: true

  # Any tool whose name matches one of these (case-insensitive regex) is never
  # exposed or callable, even if it is also listed in allowed_tools.
  # This is what enforces "stop at the cart".
  blocked_tool_patterns:
    - checkout
    - place_
    - order$              # place_food_order, create_order, confirm_order ...
    - confirm
    - submit
    - pay                 # payment, get_payment_options, check_payment_status
    - delete_
    - create_address
    - bind_user
    - add_saved_address
    - update_user
    - drop_zone
    - zepto_shop

  # Allowlist: only these tools are callable. An empty list would mean
  # "every non-blocked tool", so keep these filled in.
  allowed_tools:
    zepto:
      - list_saved_addresses
      - select_saved_address
      - get_location_serviceability
      - search_products
      - search_multiple_products
      - get_product_details
      - get_past_order_items
      - update_cart
      - view_cart
    swiggy_food:
      - flush_food_cart              # empties the agent's own Swiggy cart before a new order
      - get_addresses
      - search_restaurants
      - get_restaurant_menu
      - search_menu
      - update_food_cart
      - get_food_cart
      - fetch_food_coupons
      - apply_food_coupon
    zomato:
      - get_saved_addresses_for_user
      - get_restaurants_for_keyword
      - get_menu_items_listing
      - get_restaurant_menu_by_categories
      - create_cart

# Option 1: UPI orders after you type 'confirm <total>'. These tools stay blocked for
# normal calls; only app/ordering code can use them, through hub.call_order(), and
# the code also enforces UPI-only and the spending cap below.
ordering:
  enabled: true
  max_order_total: 1500            # rupees; any order above this is refused
  approval_valid_seconds: 300      # a typed confirm expires after 5 minutes
  payment_poll_seconds: 10         # how often to check whether you've paid
  payment_timeout_seconds: 300     # unpaid after this -> order is closed as failed
  tools:
    zepto:
      - get_payment_methods
      - create_online_payment_order
      - check_payment_status
    swiggy_food:
      - get_payment_options
      - place_food_order
      - check_payment_status
      - confirm_order
    zomato:
      - checkout_cart
      - get_order_tracking_info

# Where you are decides which saved address (and so which store/restaurants) each app uses.
# Run scripts/setup_places.py once to build places.yaml from your saved addresses.
locations:
  places_file: places.yaml
  auto_detect: true
  match_radius_m: 300          # a GPS fix must be within this of a place
  max_gps_accuracy_m: 150      # ignore vaguer fixes (IP-based location is often km off)
  gps_timeout_s: 10
  group_threshold: 0.45        # how similar address texts must be to suggest 'same place'

amazon_now:
  profile_dir: .browser/amazon_brave # its own browser profile: you log in to Amazon here once
  headless: false
  channel: brave                     # brave | chrome | chromium (Playwright's own)
  executable_path: ""                # only if Brave isn't in its usual install folder
  base_url: https://www.amazon.in
  brand_id: qqfsWw9RkO               # Amazon Now's id on amazon.in
  search_pages: 2                    # 10 results per page

scoring:
  grocery:
    w_kcal: 0.4
    w_sugar: 0.4
    w_protein: 0.2
    product_match_threshold: 90      # token_sort_ratio of cleaned names, 0-100, for 'same product'
    pack_tolerance: 0.05             # sizes may differ by 5% (100 vs 104 ml)
    details_limit: 20                # Zepto products whose nutrition label is read
    show: 15                         # products shown before you search with /word
    max_quantity: 10
  food:
    w_rating: 0.5
    w_eta: 0.3
    w_dish: 0.2
    restaurant_name_threshold: 85    # token_set_ratio, 0-100, for 'same restaurant'
    same_restaurant_max_km_diff: 1.0 # the two apps' distances must agree within this
    menu_item_threshold: 90          # token_sort_ratio, 0-100, for 'same dish'
    top_restaurants: 10
    menu_show: 30                    # dishes shown before you search with /word
    max_quantity: 10

checkpoint_db: .checkpoints/shop.sqlite